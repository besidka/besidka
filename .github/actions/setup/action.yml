name: Setup project
description: Install pnpm, Node.js 24 and the project dependencies

inputs:
  install-args:
    description: Extra arguments appended to pnpm install
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup PNPM
      uses: pnpm/action-setup@v6
      with:
        run_install: false

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
      run: pnpm install --frozen-lockfile $INSTALL_ARGS
