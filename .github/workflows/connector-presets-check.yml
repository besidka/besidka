name: Connector Presets Check

on:
  schedule:
    - cron: '30 9 * * 1'
  workflow_dispatch:

concurrency:
  group: connector-presets-check
  cancel-in-progress: true

jobs:
  check-presets:
    name: Probe connector preset URLs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Probe presets
        run: node scripts/check-connector-presets.mjs
