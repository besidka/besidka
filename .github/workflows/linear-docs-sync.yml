name: Sync Docs to Linear

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'scripts/linear-docs-sync.mjs'
  workflow_dispatch:
    inputs:
      full:
        description: 'Re-sync every document in docs/'
        type: boolean
        default: false

concurrency:
  group: linear-docs-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync docs/ to Linear documents
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Sync documents
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
          FULL_SYNC: ${{ inputs.full && 'true' || '' }}
        run: node scripts/linear-docs-sync.mjs

      # Runs even when some documents failed, so ids of documents that were
      # created are never lost (losing them would create duplicates later).
      - name: Commit document map
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- docs/.linear-docs.json; then
            echo "Document map unchanged"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/.linear-docs.json
          git commit -m 'chore(docs): update Linear document map [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
