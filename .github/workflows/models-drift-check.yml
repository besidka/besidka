name: Models Metadata Drift Check

on:
  workflow_dispatch:

concurrency:
  group: models-drift-check
  cancel-in-progress: true

jobs:
  check-drift:
    name: Verify bot PR creation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write scratch doc
        run: |
          mkdir -p docs
          echo "Scratch file for verifying bot PR creation. Safe to delete." > docs/ci-verify-bot-pr.md

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "docs: scratch bot PR verification"
          title: "docs: scratch bot PR verification (do not merge)"
          body: "Throwaway PR opened by github-actions[bot] to verify collaborators_only. Will be closed."
          branch: ci/verify-bot-pr-target
          draft: true
          delete-branch: true

      - name: Report
        env:
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          PR_OPERATION: ${{ steps.cpr.outputs.pull-request-operation }}
        run: echo "operation=$PR_OPERATION number=$PR_NUMBER url=$PR_URL"
