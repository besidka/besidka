name: Preview Build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      # NOTE: do not ignore '**/*.md' — content/*.md is the landing page
      # source and MUST trigger build+deploy (Studio publishes via commit it).
      - '.agents/**'
      - '.agent/**'
      - '.claude/**'
      - '.cursor/**'
      - '.windsurf/**'
      - '.pi/**'
      - '.github/**'
      - '.husky/**'
      - '.vscode/**'
      - 'docs/**'
      - 'lib/**'
      - 'scripts/**'
      - '.gitignore'
      - 'commitlint.config.ts'
      - '.*rc'
      - '*.md'
      - 'skills-lock.json'

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    if: github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.stack == null || github.event.pull_request.stack.position == github.event.pull_request.stack.size)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      should-skip: ${{ steps.source.outputs.should-skip }}
      source-run-id: ${{ steps.source.outputs.source-run-id }}
      source-sha: ${{ steps.source.outputs.source-sha }}
    steps:
      - name: Check if PR is still open
        run: |
          STATE=$(gh pr view ${{ github.event.pull_request.number }} --json state --jq '.state')
          if [ "$STATE" != "OPEN" ]; then
            echo "PR is $STATE, canceling workflow"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resolve build source
        id: source
        run: node scripts/ci/resolve-preview-build-source.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CURRENT_RUN_ID: ${{ github.run_id }}

  reuse-build:
    name: Reuse previous build
    needs: gate
    if: needs.gate.outputs.should-skip == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      statuses: write
      pull-requests: write
    steps:
      - name: Download previous build artifact
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.gate.outputs.source-run-id }}
          name: preview-build
          path: reused/preview-build/
          github-token: ${{ github.token }}

      - name: Download previous drizzle artifact
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.gate.outputs.source-run-id }}
          name: preview-drizzle
          path: reused/preview-drizzle/
          github-token: ${{ github.token }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: preview-build
          path: reused/preview-build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload drizzle artifact
        uses: actions/upload-artifact@v7
        with:
          name: preview-drizzle
          path: reused/preview-drizzle/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Get commit info
        id: commits
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_SHA: ${{ needs.gate.outputs.source-sha }}
        run: |
          echo "sha-short=$(echo "$HEAD_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "source-sha-short=$(echo "$SOURCE_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Comment reused build on PR
        uses: mshick/add-pr-comment@v3
        with:
          issue: ${{ github.event.pull_request.number }}
          allow-repeats: true
          message: |
            ## Reused previous build on <img width="16" alt="GitHub Actions" src="https://github.githubassets.com/favicons/favicon.svg"> GitHub Actions

            Everything changed since the last built commit is docs, CI or tooling, so the build was not repeated.

            | Property | Value |
            |----------|-------|
            | **Reused build** | [`${{ steps.commits.outputs.source-sha-short }}`](https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}/commits/${{ needs.gate.outputs.source-sha }}) from [run ${{ needs.gate.outputs.source-run-id }}](https://github.com/${{ github.repository }}/actions/runs/${{ needs.gate.outputs.source-run-id }}) |
            | **Latest commit** | [`${{ steps.commits.outputs.sha-short }}`](https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}/commits/${{ github.event.pull_request.head.sha }}) |

      - name: Set pending deploy status on PR
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state=pending \
            -f context="Preview Deploy" \
            -f description="Waiting for preview deployment..."
        env:
          GH_TOKEN: ${{ github.token }}

  static:
    name: Lint & typecheck
    needs: gate
    if: needs.gate.outputs.should-skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript type checks
        run: pnpm run typecheck

      - name: Check that migrations are committed
        run: |
          pnpm run db:generate
          pnpm run db:consents:generate

          if [ -n "$(git status --porcelain -- .drizzle)" ]; then
            echo "::error::The Drizzle schema changed without a committed migration. Run pnpm run db:generate (and db:consents:generate) locally, review the SQL for DROP TABLE (see AGENTS.md → D1 Migration Safety), and commit it."
            git status --porcelain -- .drizzle
            exit 1
          fi

  unit:
    name: Unit tests
    needs: gate
    if: needs.gate.outputs.should-skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Run all unit tests
        run: pnpm run test:unit

      - name: Run cookie-consent module tests
        run: pnpm run test:cookie-consent

  integration:
    name: Integration tests
    needs: gate
    if: needs.gate.outputs.should-skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Run all integration tests
        run: pnpm run test:integration

  build:
    name: Build
    needs: gate
    if: needs.gate.outputs.should-skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      bundle-size: ${{ steps.bundle-size.outputs.bundle-size }}
      build-duration: ${{ steps.build-app.outputs.duration }}
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Build application
        id: build-app
        env:
          ROLLDOWN_OPTIONS_VALIDATION: loose
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -o pipefail
          START=$(date +%s)
          pnpm run build 2>&1 | tee build-output.log
          END=$(date +%s)
          DURATION=$((END - START))
          echo "duration=${DURATION}s" >> "$GITHUB_OUTPUT"
          echo "✅ Build completed in ${DURATION}s"

      - name: Extract bundle size
        id: bundle-size
        run: |
          SIZE_INFO=$(grep -E "Total size:.*MB.*gzip" build-output.log | sed 's/\x1b\[[0-9;]*m//g' | sed 's/Σ Total size: //' || echo "Size information not found")
          echo "Bundle Size: $SIZE_INFO"
          echo "bundle-size=$SIZE_INFO" >> "$GITHUB_OUTPUT"

      - name: Verify build output exists
        run: |
          if [ ! -f ".output/server/index.mjs" ]; then
            echo "❌ ERROR: .output/server/index.mjs not found!"
            exit 1
          fi
          echo "✅ Build successful"
          ls -lah .output/

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: preview-build
          path: .output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload drizzle artifact
        uses: actions/upload-artifact@v7
        with:
          name: preview-drizzle
          path: .drizzle/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: E2E tests (${{ matrix.shard }}/${{ strategy.job-total }})
    needs:
      - gate
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CI: true
      NUXT_PUBLIC_BASE_URL: http://localhost:3000
      NUXT_ENCRYPTION_HASHIDS: secret
      NUXT_ENCRYPTION_KEY: secret
      NUXT_BETTER_AUTH_SECRET: secret
      NUXT_EMAIL_NOOP_ENABLED: true
      NUXT_FILES_RETENTION_CLEANUP_ENABLED: true
      NUXT_FILES_RETENTION_CLEANUP_BATCH_SIZE: 100
      NUXT_FILES_RETENTION_CLEANUP_MAX_RUNTIME_MS: 20000
      NUXT_FILES_MAINTENANCE_TOKEN: token
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Prepare E2E
        uses: ./.github/actions/prepare-e2e

      - name: Run all E2E tests
        timeout-minutes: 10
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: "!cancelled()"
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload wrangler logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: wrangler-logs-${{ matrix.shard }}
          path: |
            /home/runner/.config/.wrangler/logs/
            .wrangler/logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  summary:
    name: Summary
    needs:
      - gate
      - static
      - unit
      - integration
      - build
      - e2e
    if: >-
      !cancelled()
      && needs.gate.outputs.should-skip != 'true'
      && needs.static.result == 'success'
      && needs.unit.result == 'success'
      && needs.integration.result == 'success'
      && needs.build.result == 'success'
      && needs.e2e.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      statuses: write
      pull-requests: write
    steps:
      - name: Checkout job durations action
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: .github/actions

      - name: Read job durations
        id: durations
        continue-on-error: true
        uses: ./.github/actions/job-durations
        with:
          github-token: ${{ github.token }}

      - name: Get PR commit info
        id: pr
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "sha-short=$(echo "$SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Comment build results on PR
        uses: mshick/add-pr-comment@v3
        with:
          issue: ${{ github.event.pull_request.number }}
          allow-repeats: true
          message: |
            ## Built on <img width="16" alt="GitHub Actions" src="https://github.githubassets.com/favicons/favicon.svg"> GitHub Actions

            | Property | Value |
            |----------|-------|
            | **Author** | [@${{ github.event.pull_request.user.login }}](https://github.com/${{ github.event.pull_request.user.login }}) |
            | **Checks** | Lint & typecheck: ${{ steps.durations.outputs.static }} |
            | **Tests** | Unit: ${{ steps.durations.outputs.unit }} \| Integration: ${{ steps.durations.outputs.integration }} \| E2E: ${{ format('{0} (slowest of 3 shards)', steps.durations.outputs.e2e) }} |
            | **Build** | Nuxt: ${{ needs.build.outputs.build-duration }} \| Bundle: ${{ needs.build.outputs.bundle-size }} |
            | **Total time** | ${{ steps.durations.outputs.total }} |
            | **Latest commit** | [`${{ steps.pr.outputs.sha-short }}`](https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}/commits/${{ steps.pr.outputs.sha }}) |

      - name: Set pending deploy status on PR
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state=pending \
            -f context="Preview Deploy" \
            -f description="Waiting for preview deployment..."
        env:
          GH_TOKEN: ${{ github.token }}
