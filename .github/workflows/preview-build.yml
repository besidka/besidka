name: Preview Build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      # NOTE: do not ignore '**/*.md' — content/*.md is the landing page
      # source and MUST trigger build+deploy (Studio publishes via commit it).
      - '.agents/**'
      - '.agent/**'
      - '.claude/**'
      - '.cursor/**'
      - '.windsurf/**'
      - '.pi/**'
      - '.github/**'
      - '.husky/**'
      - '.vscode/**'
      - 'docs/**'
      - 'lib/**'
      - 'scripts/**'
      - '.gitignore'
      - 'commitlint.config.ts'
      - '.*rc'
      - '*.md'
      - 'skills-lock.json'

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-pr-state:
    name: Check PR state
    if: github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.stack == null || github.event.pull_request.stack.position == github.event.pull_request.stack.size)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check if PR is still open
        run: |
          STATE=$(gh pr view ${{ github.event.pull_request.number }} --json state --jq '.state')
          if [ "$STATE" != "OPEN" ]; then
            echo "PR is $STATE, canceling workflow"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  check-latest-commit:
    name: Check latest commit paths
    needs: check-pr-state
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      should-skip: ${{ steps.source.outputs.should-skip }}
      source-run-id: ${{ steps.source.outputs.source-run-id }}
      source-sha: ${{ steps.source.outputs.source-sha }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resolve build source
        id: source
        run: node scripts/ci/resolve-preview-build-source.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CURRENT_RUN_ID: ${{ github.run_id }}

  reuse-build:
    name: Reuse previous build
    needs:
      - check-pr-state
      - check-latest-commit
    if: needs.check-latest-commit.outputs.should-skip == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      statuses: write
      pull-requests: write
    steps:
      - name: Download previous build artifact
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.check-latest-commit.outputs.source-run-id }}
          name: preview-build
          path: reused/preview-build/
          github-token: ${{ github.token }}

      - name: Download previous drizzle artifact
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.check-latest-commit.outputs.source-run-id }}
          name: preview-drizzle
          path: reused/preview-drizzle/
          github-token: ${{ github.token }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: preview-build
          path: reused/preview-build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload drizzle artifact
        uses: actions/upload-artifact@v7
        with:
          name: preview-drizzle
          path: reused/preview-drizzle/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Get commit info
        id: commits
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_SHA: ${{ needs.check-latest-commit.outputs.source-sha }}
        run: |
          echo "sha-short=$(echo "$HEAD_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "source-sha-short=$(echo "$SOURCE_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Comment reused build on PR
        uses: mshick/add-pr-comment@v3
        with:
          issue: ${{ github.event.pull_request.number }}
          allow-repeats: true
          message: |
            ## Reused previous build on <img width="16" alt="GitHub Actions" src="https://github.githubassets.com/favicons/favicon.svg"> GitHub Actions

            Everything changed since the last built commit is docs, CI or tooling, so the build was not repeated.

            | Property | Value |
            |----------|-------|
            | **Reused build** | [`${{ steps.commits.outputs.source-sha-short }}`](https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}/commits/${{ needs.check-latest-commit.outputs.source-sha }}) from [run ${{ needs.check-latest-commit.outputs.source-run-id }}](https://github.com/${{ github.repository }}/actions/runs/${{ needs.check-latest-commit.outputs.source-run-id }}) |
            | **Latest commit** | [`${{ steps.commits.outputs.sha-short }}`](https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}/commits/${{ github.event.pull_request.head.sha }}) |

      - name: Set pending deploy status on PR
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state=pending \
            -f context="Preview Deploy" \
            -f description="Waiting for preview deployment..."
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: Build PR
    needs:
      - check-pr-state
      - check-latest-commit
    if: needs.check-latest-commit.outputs.should-skip != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    env:
      AFFECTED_BASE_REF: ${{ github.event.pull_request.stack.base.ref || github.base_ref }}
    steps:
      - name: Record start time
        id: start-time
        run: echo "start-time=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout PR code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

      - name: Run TypeScript type checks
        run: |
          bun run dev:prepare
          bun run typecheck

      - name: Run affected unit tests
        id: test-unit
        run: |
          START=$(date +%s)
          node scripts/test-affected.mjs --base="origin/$AFFECTED_BASE_REF" --type=unit
          END=$(date +%s)
          DURATION=$((END - START))
          echo "duration=${DURATION}s" >> "$GITHUB_OUTPUT"
          echo "✅ Affected unit tests completed in ${DURATION}s"

      - name: Run affected integration tests
        id: test-integration
        run: |
          START=$(date +%s)
          node scripts/test-affected.mjs --base="origin/$AFFECTED_BASE_REF" --type=integration
          END=$(date +%s)
          DURATION=$((END - START))
          echo "duration=${DURATION}s" >> "$GITHUB_OUTPUT"
          echo "✅ Affected integration tests completed in ${DURATION}s"

      - name: Check affected E2E tests
        id: check-e2e
        run: >-
          node scripts/test-affected-check.mjs
          --base="origin/$AFFECTED_BASE_REF"
          --type=e2e

      - name: Set Playwright browsers path
        if: steps.check-e2e.outputs.has-tests == 'true'
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        id: playwright-cache
        if: steps.check-e2e.outputs.has-tests == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.check-e2e.outputs.has-tests == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Generate DB migrations for E2E
        if: steps.check-e2e.outputs.has-tests == 'true'
        run: bun run db:generate

      - name: Apply DB migrations for E2E
        if: steps.check-e2e.outputs.has-tests == 'true'
        run: yes | bunx wrangler d1 migrations apply DB --local

      - name: Generate consent DB migrations for E2E
        if: steps.check-e2e.outputs.has-tests == 'true'
        run: bun run db:consents:generate

      - name: Apply consent DB migrations for E2E
        if: steps.check-e2e.outputs.has-tests == 'true'
        run: yes | bunx wrangler d1 migrations apply CONSENT_DB --local

      - name: Build application
        id: build-app
        env:
          ROLLDOWN_OPTIONS_VALIDATION: loose
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -o pipefail
          START=$(date +%s)
          bun run build 2>&1 | tee build-output.log
          END=$(date +%s)
          DURATION=$((END - START))
          echo "duration=${DURATION}s" >> "$GITHUB_OUTPUT"
          echo "✅ Build completed in ${DURATION}s"

      - name: Extract bundle size
        id: bundle-size
        run: |
          SIZE_INFO=$(grep -E "Total size:.*MB.*gzip" build-output.log | sed 's/\x1b\[[0-9;]*m//g' | sed 's/Σ Total size: //' || echo "Size information not found")
          echo "Bundle Size: $SIZE_INFO"
          echo "bundle-size=$SIZE_INFO" >> "$GITHUB_OUTPUT"

      - name: Verify build output exists
        run: |
          if [ ! -f ".output/server/index.mjs" ]; then
            echo "❌ ERROR: .output/server/index.mjs not found!"
            exit 1
          fi
          echo "✅ Build successful"
          ls -lah .output/

      - name: Write .dev.vars for CI e2e
        if: steps.check-e2e.outputs.has-tests == 'true'
        run: |
          cat > .dev.vars <<'EOF'
          CI=true
          NUXT_PUBLIC_BASE_URL=http://localhost:3000
          NUXT_PUBLIC_E2E_TEST_HOOKS_ENABLED=true
          NUXT_ENCRYPTION_HASHIDS=secret
          NUXT_ENCRYPTION_KEY=secret
          NUXT_BETTER_AUTH_SECRET=secret
          NUXT_EMAIL_NOOP_ENABLED=true
          NUXT_FILES_RETENTION_CLEANUP_ENABLED=true
          NUXT_FILES_RETENTION_CLEANUP_BATCH_SIZE=100
          NUXT_FILES_RETENTION_CLEANUP_MAX_RUNTIME_MS=20000
          NUXT_FILES_MAINTENANCE_TOKEN=token
          EOF

      - name: Run affected E2E tests
        id: test-e2e
        if: steps.check-e2e.outputs.has-tests == 'true'
        timeout-minutes: 12
        run: |
          START=$(date +%s)
          node scripts/test-affected.mjs --base="origin/$AFFECTED_BASE_REF" --type=e2e
          END=$(date +%s)
          DURATION=$((END - START))
          echo "duration=${DURATION}s" >> "$GITHUB_OUTPUT"
          echo "✅ Affected E2E tests completed in ${DURATION}s"
        env:
          CI: true
          NUXT_PUBLIC_BASE_URL: http://localhost:3000
          NUXT_ENCRYPTION_HASHIDS: secret
          NUXT_ENCRYPTION_KEY: secret
          NUXT_BETTER_AUTH_SECRET: secret
          NUXT_EMAIL_NOOP_ENABLED: true
          NUXT_FILES_RETENTION_CLEANUP_ENABLED: true
          NUXT_FILES_RETENTION_CLEANUP_BATCH_SIZE: 100
          NUXT_FILES_RETENTION_CLEANUP_MAX_RUNTIME_MS: 20000
          NUXT_FILES_MAINTENANCE_TOKEN: token

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: "!cancelled() && steps.check-e2e.outputs.has-tests == 'true'"
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload wrangler logs
        uses: actions/upload-artifact@v7
        if: "failure() && steps.check-e2e.outputs.has-tests == 'true'"
        with:
          name: wrangler-logs
          path: |
            /home/runner/.config/.wrangler/logs/
            .wrangler/logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: preview-build
          path: .output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload drizzle artifact
        uses: actions/upload-artifact@v7
        with:
          name: preview-drizzle
          path: .drizzle/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Get PR commit info
        if: success()
        id: pr
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "sha-short=$(echo "$SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Calculate total duration
        if: success()
        id: duration
        run: |
          START_TIME=${{ steps.start-time.outputs.start-time }}
          END_TIME=$(date +%s)
          TOTAL=$((END_TIME - START_TIME))
          MINUTES=$((TOTAL / 60))
          SECONDS=$((TOTAL % 60))
          if [ $MINUTES -gt 0 ]; then
            DURATION="${MINUTES}m ${SECONDS}s"
          else
            DURATION="${SECONDS}s"
          fi
          echo "total=$DURATION" >> "$GITHUB_OUTPUT"

      - name: Comment build results on PR
        if: success()
        uses: mshick/add-pr-comment@v3
        with:
          issue: ${{ github.event.pull_request.number }}
          allow-repeats: true
          message: |
            ## Built on <img width="16" alt="GitHub Actions" src="https://github.githubassets.com/favicons/favicon.svg"> GitHub Actions

            | Property | Value |
            |----------|-------|
            | **Author** | [@${{ github.event.pull_request.user.login }}](https://github.com/${{ github.event.pull_request.user.login }}) |
            | **Tests** | Unit: ${{ steps.test-unit.outputs.duration }} \| Integration: ${{ steps.test-integration.outputs.duration }} \| E2E: ${{ steps.test-e2e.outputs.duration || 'skipped' }} |
            | **Build** | Nuxt: ${{ steps.build-app.outputs.duration }} \| Bundle: ${{ steps.bundle-size.outputs.bundle-size }} |
            | **Total time** | ${{ steps.duration.outputs.total }} |
            | **Latest commit** | [`${{ steps.pr.outputs.sha-short }}`](https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}/commits/${{ steps.pr.outputs.sha }}) |

      - name: Set pending deploy status on PR
        if: success()
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state=pending \
            -f context="Preview Deploy" \
            -f description="Waiting for preview deployment..."
        env:
          GH_TOKEN: ${{ github.token }}
