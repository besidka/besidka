name: Update PRs

on:
  pull_request_target:
    types: [opened]

jobs:
  update:
    name: "Update PRs"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      pull-requests: write
      issues: write
      contents: read

    steps:
      - name: Get commit messages
        id: commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT_MESSAGES=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits" --paginate --jq '.[].commit.message | split("\n")[0]')
          DELIMITER="EOF_$(openssl rand -hex 8)"

          {
            echo "messages<<${DELIMITER}"
            echo "$COMMIT_MESSAGES"
            echo "${DELIMITER}"
          } >> "$GITHUB_OUTPUT"

      - name: Automatically assign user to PR
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && !endsWith(github.actor, '[bot]') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ASSIGNEE: ${{ github.actor }}
        run: |
          retry() {
            local delays=(5 15)
            local attempt

            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi

              if [[ "$attempt" -lt 3 ]]; then
                sleep "${delays[$((attempt - 1))]}"
              fi
            done

            return 1
          }

          retry gh api --method POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/assignees" -f "assignees[]=${ASSIGNEE}" --silent

      - name: Add to MVP Milestone
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: andrefcdias/add-to-milestone@v1.3.0
        continue-on-error: true
        with:
          repo-token: ${{ secrets.PROJECT_ACTIONS_GITHUB_TOKEN }}
          milestone: "MVP"

      - name: Add PR to Project
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/add-to-project@v2.0.0
        with:
          project-url: https://github.com/orgs/${{ github.repository_owner }}/projects/2
          github-token: ${{ secrets.PROJECT_ACTIONS_GITHUB_TOKEN }}

      - name: Determine labels to add
        id: labels
        if: ${{ !cancelled() }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          COMMIT_MESSAGES: ${{ steps.commits.outputs.messages }}
        run: |
          labels_to_add=""

          label_types=("feat" "fix" "docs" "test")

          for label in "${label_types[@]}"; do
            should_add_label=false

            if [[ "${{ github.event_name }}" == "pull_request_target" ]]; then
              if [[ "$PR_BODY" == ${label}* ]]; then
                should_add_label=true
              fi

              if [[ "$COMMIT_MESSAGES" == *"${label}:"* ]] || [[ "$COMMIT_MESSAGES" == *"${label}("* ]]; then
                should_add_label=true
              fi
            fi

            if [[ "$should_add_label" == "true" ]]; then
              if [[ -n "$labels_to_add" ]]; then
                labels_to_add="${labels_to_add}"$'\n'"${label}"
              else
                labels_to_add="$label"
              fi
            fi
          done

          if [[ "${{ github.event_name }}" == "pull_request_target" ]]; then
            add_label() {
              local label="$1"

              if [[ $'\n'"$labels_to_add"$'\n' == *$'\n'"${label}"$'\n'* ]]; then
                return
              fi

              if [[ -n "$labels_to_add" ]]; then
                labels_to_add="${labels_to_add}"$'\n'"${label}"
              else
                labels_to_add="$label"
              fi
            }

            label_rules=(
              "dependencies:chore(deps,security(snyk)"
              "critical:security"
            )

            for rule in "${label_rules[@]}"; do
              IFS=':' read -r label patterns <<< "$rule"
              IFS=',' read -ra pattern_list <<< "$patterns"

              for pattern in "${pattern_list[@]}"; do
                if [[ "$COMMIT_MESSAGES" == *"$pattern"* ]]; then
                  add_label "$label"
                  break
                fi
              done
            done
          fi

          DELIMITER="EOF_$(openssl rand -hex 8)"

          {
            echo "labels<<${DELIMITER}"
            echo "$labels_to_add"
            echo "${DELIMITER}"
          } >> "$GITHUB_OUTPUT"

      - name: Add labels
        if: ${{ !cancelled() && steps.labels.outputs.labels != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          LABELS: ${{ steps.labels.outputs.labels }}
        run: |
          retry() {
            local delays=(5 15)
            local attempt

            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi

              if [[ "$attempt" -lt 3 ]]; then
                sleep "${delays[$((attempt - 1))]}"
              fi
            done

            return 1
          }

          has_failure=false

          while IFS= read -r label; do
            if [[ -z "$label" ]]; then
              continue
            fi

            if ! retry gh pr edit "$PR_URL" --add-label "$label"; then
              echo "::error::Failed to add label: ${label}"
              has_failure=true
            fi
          done <<< "$LABELS"

          if [[ "$has_failure" == "true" ]]; then
            exit 1
          fi
