name: Deploy to Production

on:
  push:
    branches: ['main']
    paths-ignore:
      # NOTE: do not ignore '**/*.md' — content/*.md is the landing page
      # source and MUST trigger build+deploy (Studio publishes via commit it).
      - '.agents/**'
      - '.agent/**'
      - '.claude/**'
      - '.cursor/**'
      - '.windsurf/**'
      - '.pi/**'
      - '.github/**'
      - '.husky/**'
      - '.vscode/**'
      - 'docs/**'
      - 'lib/**'
      - 'scripts/**'
      - '.gitignore'
      - 'commitlint.config.ts'
      - '.*rc'
      - '*.md'
      - 'skills-lock.json'
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build-production:
    name: Build and Deploy to Production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
      bundle-size: ${{ steps.bundle-size.outputs.bundle-size }}
      duration: ${{ steps.calculate-duration.outputs.duration }}
      test-unit-time: ${{ steps.test-unit.outputs.duration }}
      test-integration-time: ${{ steps.test-integration.outputs.duration }}
      test-e2e-time: ${{ steps.test-e2e.outputs.duration }}
      build-time: ${{ steps.build-app.outputs.duration }}
      deploy-time: ${{ steps.deploy-app.outputs.duration }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Record start time
        id: start-time
        run: echo "start-time=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PNPM
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript type checks
        run: |
          pnpm run dev:prepare
          pnpm run typecheck

      - name: Run all unit tests
        id: test-unit
        run: |
          START=$(date +%s)
          pnpm run test:unit
          END=$(date +%s)
          DURATION=$((END - START))
          echo "duration=${DURATION}s" >> $GITHUB_OUTPUT
          echo "✅ All unit tests completed in ${DURATION}s"

      - name: Run all integration tests
        id: test-integration
        run: |
          START=$(date +%s)
          pnpm run test:integration
          END=$(date +%s)
          DURATION=$((END - START))
          echo "duration=${DURATION}s" >> $GITHUB_OUTPUT
          echo "✅ All integration tests completed in ${DURATION}s"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
        
      - name: Generate DB migrations for E2E
        run: pnpm run db:generate

      - name: Apply DB migrations for E2E
        run: yes | pnpm exec wrangler d1 migrations apply DB --local

      - name: Generate consent DB migrations for E2E
        run: pnpm run db:consents:generate

      - name: Apply consent DB migrations for E2E
        run: yes | pnpm exec wrangler d1 migrations apply CONSENT_DB --local

      - name: Build application
        id: build-app
        env:
          ROLLDOWN_OPTIONS_VALIDATION: loose
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -o pipefail
          START=$(date +%s)
          pnpm run build 2>&1 | tee build-output.log
          END=$(date +%s)
          DURATION=$((END - START))
          echo "duration=${DURATION}s" >> $GITHUB_OUTPUT
          echo "✅ Build completed in ${DURATION}s"

      - name: Extract bundle size
        id: bundle-size
        run: |
          SIZE_INFO=$(grep -E "Total size:.*MB.*gzip" build-output.log | sed 's/\x1b\[[0-9;]*m//g' | sed 's/Σ Total size: //' || echo "Size information not found")
          echo "Bundle Size: $SIZE_INFO"
          echo "bundle-size=$SIZE_INFO" >> $GITHUB_OUTPUT

      - name: Verify build output exists
        run: |
          echo "Checking if .output/server/index.mjs exists..."
          if [ ! -f ".output/server/index.mjs" ]; then
            echo "❌ ERROR: .output/server/index.mjs not found!"
            echo "Build may have failed silently."
            echo ""
            echo "Current directory contents:"
            ls -la
            echo ""
            echo "Checking for common build output locations:"
            ls -la dist/ 2>/dev/null || echo "No dist/ directory"
            ls -la build/ 2>/dev/null || echo "No build/ directory"
            exit 1
          fi

          echo "✅ .output/server/index.mjs exists"
          echo ""
          echo "Contents of .output/:"
          ls -lah .output/
          echo ""
          echo "Disk usage:"
          du -sh .output/

      - name: Write .dev.vars for CI e2e
        run: |
          cat > .dev.vars <<'EOF'
          CI=true
          NUXT_PUBLIC_BASE_URL=http://localhost:3000
          NUXT_PUBLIC_E2E_TEST_HOOKS_ENABLED=true
          NUXT_ENCRYPTION_HASHIDS=secret
          NUXT_ENCRYPTION_KEY=secret
          NUXT_BETTER_AUTH_SECRET=secret
          NUXT_EMAIL_NOOP_ENABLED=true
          NUXT_FILES_RETENTION_CLEANUP_ENABLED=true
          NUXT_FILES_RETENTION_CLEANUP_BATCH_SIZE=100
          NUXT_FILES_RETENTION_CLEANUP_MAX_RUNTIME_MS=20000
          NUXT_FILES_MAINTENANCE_TOKEN=token
          EOF

      - name: Run all E2E tests
        id: test-e2e
        timeout-minutes: 15
        run: |
          START=$(date +%s)
          pnpm run test:e2e
          END=$(date +%s)
          DURATION=$((END - START))
          echo "duration=${DURATION}s" >> $GITHUB_OUTPUT
          echo "✅ All E2E tests completed in ${DURATION}s"
        env:
          CI: true
          NUXT_PUBLIC_BASE_URL: http://localhost:3000
          NUXT_ENCRYPTION_HASHIDS: secret
          NUXT_ENCRYPTION_KEY: secret
          NUXT_BETTER_AUTH_SECRET: secret
          NUXT_EMAIL_NOOP_ENABLED: true
          NUXT_FILES_RETENTION_CLEANUP_ENABLED: true
          NUXT_FILES_RETENTION_CLEANUP_BATCH_SIZE: 100
          NUXT_FILES_RETENTION_CLEANUP_MAX_RUNTIME_MS: 20000
          NUXT_FILES_MAINTENANCE_TOKEN: token
          PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: '!cancelled()'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload wrangler logs
        uses: actions/upload-artifact@v7
        if: "failure()"
        with:
          name: wrangler-logs
          path: |
            /home/runner/.config/.wrangler/logs/
            .wrangler/logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: preview-build
          path: .output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Record deploy start time
        id: deploy-start
        run: echo "start-time=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Apply migrations to production database
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          preCommands: pnpm run db:generate
          command: -v
          postCommands: yes | pnpm exec wrangler d1 migrations apply DB --remote --env production

      - name: Apply consent migrations to production database
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          preCommands: pnpm run db:consents:generate
          command: -v
          postCommands: yes | pnpm exec wrangler d1 migrations apply CONSENT_DB --remote --env production

      - name: Deploy app to Cloudflare Workers via Wrangler
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          command: deploy --env production

      - name: Calculate deploy time
        id: deploy-app
        run: |
          START=${{ steps.deploy-start.outputs.start-time }}
          END=$(date +%s)
          DURATION=$((END - START))
          echo "duration=${DURATION}s" >> $GITHUB_OUTPUT
          echo "✅ Deploy completed in ${DURATION}s"

      - name: Print deployed URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: echo $DEPLOYMENT_URL

      - name: Calculate total duration and print summary
        id: calculate-duration
        run: |
          START_TIME=${{ steps.start-time.outputs.start-time }}
          END_TIME=$(date +%s)
          TOTAL_DURATION=$((END_TIME - START_TIME))
          MINUTES=$((TOTAL_DURATION / 60))
          SECONDS=$((TOTAL_DURATION % 60))
          if [ $MINUTES -gt 0 ]; then
            DURATION_FORMAT="${MINUTES}m ${SECONDS}s"
          else
            DURATION_FORMAT="${SECONDS}s"
          fi
          echo "duration=$DURATION_FORMAT" >> $GITHUB_OUTPUT

          # Print beautiful summary
          echo ""
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║                    BUILD SUMMARY                           ║"
          echo "╠════════════════════════════════════════════════════════════╣"
          echo "║                                                            ║"
          echo "║  📊 Test Results:                                          ║"
          echo "║     • Unit tests:        ${{ steps.test-unit.outputs.duration }}" | awk '{printf "%-60s║\n", $0}'
          echo "║     • Integration tests: ${{ steps.test-integration.outputs.duration }}" | awk '{printf "%-60s║\n", $0}'
          echo "║     • E2E tests:         ${{ steps.test-e2e.outputs.duration }}" | awk '{printf "%-60s║\n", $0}'
          echo "║                                                            ║"
          echo "║  🏗️  Build Process:                                        ║"
          echo "║     • Nuxt build:        ${{ steps.build-app.outputs.duration }}" | awk '{printf "%-60s║\n", $0}'
          echo "║     • Bundle size:       ${{ steps.bundle-size.outputs.bundle-size }}" | awk '{printf "%-60s║\n", $0}'
          echo "║                                                            ║"
          echo "║  🚀 Deployment:                                            ║"
          echo "║     • Deploy time:       ${{ steps.deploy-app.outputs.duration }}" | awk '{printf "%-60s║\n", $0}'
          echo "║     • URL:               ${{ steps.deploy.outputs.deployment-url }}" | awk '{printf "%-60s║\n", $0}' | head -c 66
          echo "║                                                            ║"
          echo "║  ⏱️  Total Time:          ${DURATION_FORMAT}" | awk '{printf "%-60s║\n", $0}'
          echo "║                                                            ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""

  indexnow:
    name: Notify IndexNow
    needs: build-production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    # No-op until the owner creates the INDEXNOW_KEY secret and sets
    # NUXT_INDEXNOW_KEY on the production Worker to the same value — see
    # docs/seo.md → "IndexNow".
    env:
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

    steps:
      - name: Skip when INDEXNOW_KEY is not configured
        if: env.INDEXNOW_KEY == ''
        run: echo "INDEXNOW_KEY secret is not set; skipping IndexNow."

      - name: Checkout
        if: env.INDEXNOW_KEY != ''
        uses: actions/checkout@v7

      - name: Install Node.js
        if: env.INDEXNOW_KEY != ''
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Submit changed public pages to IndexNow
        if: env.INDEXNOW_KEY != ''
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          SITE_URL: https://besidka.com
        run: |
          if [ "$EVENT_NAME" != "push" ] \
            || [ -z "$BEFORE_SHA" ] \
            || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
            || ! git fetch --depth=1 origin "$BEFORE_SHA"; then
            node scripts/indexnow-submit.mjs --all
            exit $?
          fi

          git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" > changed-files.txt
          node scripts/indexnow-submit.mjs --changed-files=changed-files.txt

  deploy-preview:
    name: Deploy long-lived preview
    needs: build-production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: preview-build
          path: .output/

      - name: Setup PNPM
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to preview database
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          preCommands: pnpm run db:generate
          command: -v
          postCommands: yes | pnpm exec wrangler d1 migrations apply DB --remote

      - name: Apply consent migrations to preview database
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          preCommands: pnpm run db:consents:generate
          command: -v
          postCommands: yes | pnpm exec wrangler d1 migrations apply CONSENT_DB --remote

      - name: Deploy long-lived preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          pnpm exec wrangler preview \
            --env production \
            --name preview \
            --message "main@${COMMIT_SHA}"

  cleanup-preview-build-artifact:
    name: Cleanup preview build artifact
    needs:
      - build-production
      - deploy-preview
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete preview-build artifact
        run: |
          ARTIFACT_IDS=$(gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "preview-build") | .id')

          if [ -z "$ARTIFACT_IDS" ]; then
            echo "No preview-build artifacts found for run ${{ github.run_id }}"
            exit 0
          fi

          for artifactId in $ARTIFACT_IDS; do
            gh api "repos/${{ github.repository }}/actions/artifacts/${artifactId}" \
              -X DELETE
            echo "Deleted preview-build artifact ${artifactId}"
          done
        env:
          GH_TOKEN: ${{ github.token }}
