name: Deploy to Production

on:
  push:
    branches: ['main']
    paths-ignore:
      # NOTE: do not ignore '**/*.md' — content/*.md is the landing page
      # source and MUST trigger build+deploy (Studio publishes via commit it).
      - '.agents/**'
      - '.agent/**'
      - '.claude/**'
      - '.cursor/**'
      - '.windsurf/**'
      - '.pi/**'
      - '.github/**'
      - '.husky/**'
      - '.vscode/**'
      - 'docs/**'
      - 'lib/**'
      - 'scripts/**'
      - '.gitignore'
      - 'commitlint.config.ts'
      - '*.md'
      - 'skills-lock.json'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and test without deploying anything
        type: boolean
        default: false

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && !inputs.dry-run && 'production' || format('production-dry-run-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      skip-tests: ${{ steps.source.outputs.skip-tests }}
      source-run-id: ${{ steps.source.outputs.source-run-id }}
      source-sha: ${{ steps.source.outputs.source-sha }}
      pr-number: ${{ steps.source.outputs.pr-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resolve test source
        id: source
        run: node scripts/ci/resolve-production-test-source.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}

  static:
    name: Lint & typecheck
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.skip-tests != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript type checks
        run: pnpm run typecheck

      - name: Check that migrations are committed
        run: |
          if ! pnpm run db:generate || ! pnpm run db:consents:generate; then
            echo "::error::drizzle-kit could not generate migrations. It exits non-zero when it needs an interactive answer, for example whether a column was renamed or newly created, and CI cannot answer. Run pnpm run db:generate (and db:consents:generate) locally, answer the prompts, and commit the migration."
            exit 1
          fi

          if [ -n "$(git status --porcelain -- .drizzle)" ]; then
            echo "::error::The Drizzle schema changed without a committed migration. Run pnpm run db:generate (and db:consents:generate) locally, review the SQL for DROP TABLE (see AGENTS.md → D1 Migration Safety), and commit it."
            git status --porcelain -- .drizzle
            exit 1
          fi

  unit:
    name: Unit tests
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.skip-tests != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Run all unit tests
        run: pnpm run test:unit

      - name: Run cookie-consent module tests
        run: pnpm run test:cookie-consent

  integration:
    name: Integration tests
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.skip-tests != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Run all integration tests
        run: pnpm run test:integration

  build:
    name: Build
    needs: gate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      bundle-size: ${{ steps.bundle-size.outputs.bundle-size }}
      build-duration: ${{ steps.build-app.outputs.duration }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Build application
        id: build-app
        env:
          ROLLDOWN_OPTIONS_VALIDATION: loose
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -o pipefail
          START=$(date +%s)
          pnpm run build 2>&1 | tee build-output.log
          END=$(date +%s)
          DURATION=$((END - START))
          echo "duration=${DURATION}s" >> "$GITHUB_OUTPUT"
          echo "✅ Build completed in ${DURATION}s"

      - name: Extract bundle size
        id: bundle-size
        run: |
          SIZE_INFO=$(grep -E "Total size:.*MB.*gzip" build-output.log | sed 's/\x1b\[[0-9;]*m//g' | sed 's/Σ Total size: //' || echo "Size information not found")
          echo "Bundle Size: $SIZE_INFO"
          echo "bundle-size=$SIZE_INFO" >> "$GITHUB_OUTPUT"

      - name: Verify build output exists
        run: |
          if [ ! -f ".output/server/index.mjs" ]; then
            echo "❌ ERROR: .output/server/index.mjs not found!"
            exit 1
          fi
          echo "✅ Build successful"
          ls -lah .output/

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: preview-build
          path: .output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: E2E tests (${{ matrix.shard }}/${{ strategy.job-total }})
    needs:
      - gate
      - build
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.gate.outputs.skip-tests != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CI: true
      NUXT_PUBLIC_BASE_URL: http://localhost:3000
      NUXT_ENCRYPTION_HASHIDS: secret
      NUXT_ENCRYPTION_KEY: secret
      NUXT_BETTER_AUTH_SECRET: secret
      NUXT_EMAIL_NOOP_ENABLED: true
      NUXT_FILES_RETENTION_CLEANUP_ENABLED: true
      NUXT_FILES_RETENTION_CLEANUP_BATCH_SIZE: 100
      NUXT_FILES_RETENTION_CLEANUP_MAX_RUNTIME_MS: 20000
      NUXT_FILES_MAINTENANCE_TOKEN: token
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Prepare E2E
        uses: ./.github/actions/prepare-e2e

      - name: Run all E2E tests
        timeout-minutes: 10
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: "!cancelled()"
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload wrangler logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: wrangler-logs-${{ matrix.shard }}
          path: |
            /home/runner/.config/.wrangler/logs/
            .wrangler/logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  playwright-cache:
    name: Warm Playwright cache
    needs: gate
    if: needs.gate.outputs.skip-tests == 'true'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Prepare Playwright
        uses: ./.github/actions/playwright

  deploy-satellites:
    name: Deploy satellite Workers
    needs:
      - gate
      - static
      - unit
      - integration
      - build
      - e2e
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main'
      && inputs.dry-run != true
      && vars.ARTIFACTS_RUNTIME_DEPLOY_ENABLED == 'true'
      && needs.build.result == 'success'
      && (needs.gate.outputs.skip-tests == 'true'
      || (needs.static.result == 'success'
      && needs.unit.result == 'success'
      && needs.integration.result == 'success'
      && needs.e2e.result == 'success'))
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: satellite-besidka-artifacts
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect artifacts runtime changes
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            echo "No previous commit to compare with; deploying the artifacts runtime."
            echo "artifacts-runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" | grep -qE '^(workers/artifacts-runtime/|packages/artifacts-protocol/)'; then
            echo "artifacts-runtime=true" >> "$GITHUB_OUTPUT"
          else
            echo "The artifacts runtime did not change; nothing to deploy."
            echo "artifacts-runtime=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup project
        if: steps.changes.outputs.artifacts-runtime == 'true'
        uses: ./.github/actions/setup

      - name: Build the artifacts runtime
        if: steps.changes.outputs.artifacts-runtime == 'true'
        run: pnpm run artifacts:build

      - name: Deploy the artifacts runtime
        if: steps.changes.outputs.artifacts-runtime == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          workingDirectory: workers/artifacts-runtime
          command: deploy

  deploy:
    name: Deploy to Production
    needs:
      - gate
      - static
      - unit
      - integration
      - build
      - e2e
      - deploy-satellites
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main'
      && inputs.dry-run != true
      && needs.build.result == 'success'
      && (needs.deploy-satellites.result == 'success'
      || needs.deploy-satellites.result == 'skipped')
      && (needs.gate.outputs.skip-tests == 'true'
      || (needs.static.result == 'success'
      && needs.unit.result == 'success'
      && needs.integration.result == 'success'
      && needs.e2e.result == 'success'))
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: preview-build
          path: .output/

      - name: Apply migrations to production database
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          command: -v
          postCommands: yes | pnpm exec wrangler d1 migrations apply DB --remote --env production

      - name: Apply consent migrations to production database
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          command: -v
          postCommands: yes | pnpm exec wrangler d1 migrations apply CONSENT_DB --remote --env production

      - name: Deploy app to Cloudflare Workers via Wrangler
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          command: deploy --env production

      - name: Print deployed URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: echo "$DEPLOYMENT_URL"

      - name: Read job durations
        id: durations
        continue-on-error: true
        uses: ./.github/actions/job-durations
        with:
          github-token: ${{ github.token }}

      - name: Write run summary
        env:
          SKIP_TESTS: ${{ needs.gate.outputs.skip-tests }}
          SOURCE_PR_NUMBER: ${{ needs.gate.outputs.pr-number }}
          SOURCE_RUN_ID: ${{ needs.gate.outputs.source-run-id }}
          STATIC_DURATION: ${{ steps.durations.outputs.static }}
          UNIT_DURATION: ${{ steps.durations.outputs.unit }}
          INTEGRATION_DURATION: ${{ steps.durations.outputs.integration }}
          E2E_DURATION: ${{ steps.durations.outputs.e2e }}
          BUILD_DURATION: ${{ needs.build.outputs.build-duration }}
          BUNDLE_SIZE: ${{ needs.build.outputs.bundle-size }}
          TOTAL_DURATION: ${{ steps.durations.outputs.total }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ "$SKIP_TESTS" = "true" ]; then
            TESTS_RESULT="reused from PR #$SOURCE_PR_NUMBER (run $SOURCE_RUN_ID)"
          else
            TESTS_RESULT="ran on main"
          fi

          {
            echo "## Production deploy"
            echo ""
            echo "| Stage | Result |"
            echo "|-------|--------|"
            echo "| Tests | $TESTS_RESULT |"
            echo "| Lint & typecheck | $STATIC_DURATION |"
            echo "| Unit tests | $UNIT_DURATION |"
            echo "| Integration tests | $INTEGRATION_DURATION |"
            echo "| E2E tests (slowest of 3 shards) | $E2E_DURATION |"
            echo "| Nuxt build | $BUILD_DURATION |"
            echo "| Bundle size | $BUNDLE_SIZE |"
            echo "| Total time | $TOTAL_DURATION |"
            echo "| URL | $DEPLOYMENT_URL |"
          } >> "$GITHUB_STEP_SUMMARY"

  indexnow:
    name: Notify IndexNow
    needs: deploy
    if: >-
      !cancelled()
      && needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    # No-op until the owner creates the INDEXNOW_KEY secret and sets
    # NUXT_INDEXNOW_KEY on the production Worker to the same value — see
    # docs/seo.md → "IndexNow".
    env:
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

    steps:
      - name: Skip when INDEXNOW_KEY is not configured
        if: env.INDEXNOW_KEY == ''
        run: echo "INDEXNOW_KEY secret is not set; skipping IndexNow."

      - name: Checkout
        if: env.INDEXNOW_KEY != ''
        uses: actions/checkout@v7

      - name: Install Node.js
        if: env.INDEXNOW_KEY != ''
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Submit changed public pages to IndexNow
        if: env.INDEXNOW_KEY != ''
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          SITE_URL: https://besidka.com
        run: |
          if [ "$EVENT_NAME" != "push" ] \
            || [ -z "$BEFORE_SHA" ] \
            || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
            || ! git fetch --depth=1 origin "$BEFORE_SHA"; then
            node scripts/indexnow-submit.mjs --all
            exit $?
          fi

          git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" > changed-files.txt
          node scripts/indexnow-submit.mjs --changed-files=changed-files.txt

  mcp-registry:
    name: Publish to MCP Registry
    needs: deploy
    if: >-
      !cancelled()
      && needs.deploy.result == 'success'
      && github.ref == 'refs/heads/main'
      && inputs.dry-run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MCP_PUBLISHER_TAG: v1.8.7
      MCP_PUBLISHER_ARCHIVE: mcp-publisher_linux_amd64.tar.gz
      MCP_PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
      MCP_REGISTRY_VERSIONS_URL: https://registry.modelcontextprotocol.io/v0.1/servers/com.besidka%2Fmcp/versions
      MCP_REGISTRY_STATUS_KEY: io.modelcontextprotocol.registry/official

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read the version from server.json
        id: version
        run: |
          VERSION=$(jq -r '.version' server.json)

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::server.json version \"$VERSION\" is not MAJOR.MINOR.PATCH"
            exit 1
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether the version is already published
        id: registry
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          STATUS=$(curl -s -o published.json -w '%{http_code}' --retry 3 --retry-all-errors "$MCP_REGISTRY_VERSIONS_URL/$VERSION")

          case "$STATUS" in
            200) echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::The registry answered HTTP $STATUS for com.besidka/mcp $VERSION"
              exit 1
              ;;
          esac

          echo "com.besidka/mcp $VERSION registry status: HTTP $STATUS" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when server.json differs from the published version
        if: steps.registry.outputs.published == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          FIELDS='{name, description, version, remotes, websiteUrl, repository, icons}'
          jq -S "$FIELDS" server.json > local-entry.json
          jq -S ".server | $FIELDS" published.json > published-entry.json

          if ! diff -u published-entry.json local-entry.json; then
            echo "::error::server.json changed but version $VERSION is already published; bump MCP_SERVER_VERSION (config/mcp-server.ts, server.json and plugins/besidka)"
            exit 1
          fi

      - name: Install mcp-publisher
        if: steps.registry.outputs.published == 'false'
        run: |
          RELEASE_URL="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_TAG"
          INSTALL_DIR="$RUNNER_TEMP/mcp-publisher"

          mkdir -p "$INSTALL_DIR"
          curl -fsSL --retry 3 -o "$INSTALL_DIR/$MCP_PUBLISHER_ARCHIVE" "$RELEASE_URL/$MCP_PUBLISHER_ARCHIVE"
          curl -fsSL --retry 3 -o "$INSTALL_DIR/checksums.txt" "$RELEASE_URL/registry_${MCP_PUBLISHER_TAG#v}_checksums.txt"

          cd "$INSTALL_DIR"
          echo "$MCP_PUBLISHER_SHA256  $MCP_PUBLISHER_ARCHIVE" | sha256sum --check --strict -
          awk -v name="$MCP_PUBLISHER_ARCHIVE" '$2 == name' checksums.txt | sha256sum --check --strict -
          tar -xzf "$MCP_PUBLISHER_ARCHIVE" mcp-publisher

          echo "$INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Validate server.json
        if: steps.registry.outputs.published == 'false'
        run: mcp-publisher validate

      - name: Log in to the registry
        if: steps.registry.outputs.published == 'false'
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          if [ -z "$MCP_REGISTRY_PRIVATE_KEY" ]; then
            echo "::error::The MCP_REGISTRY_PRIVATE_KEY secret is not set"
            exit 1
          fi

          mcp-publisher login http --domain besidka.com --private-key "$MCP_REGISTRY_PRIVATE_KEY" > /dev/null

      - name: Publish to the registry
        if: steps.registry.outputs.published == 'false'
        run: mcp-publisher publish

      - name: Verify the published version is active
        if: steps.registry.outputs.published == 'false'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          STATUS=""
          for _ in 1 2 3 4 5; do
            curl -s --retry 3 --retry-all-errors -o response.json -w '%{http_code}' "$MCP_REGISTRY_VERSIONS_URL/$VERSION" > http-status.txt || true
            STATUS=$(cat http-status.txt)

            if [ "$STATUS" = "200" ]; then
              break
            fi

            sleep 3
          done

          if [ "$STATUS" != "200" ]; then
            echo "::error::The registry answered HTTP $STATUS for com.besidka/mcp $VERSION after publishing"
            exit 1
          fi

          ACTIVE=$(jq -r --arg key "$MCP_REGISTRY_STATUS_KEY" '._meta[$key].status' response.json)

          if [ "$ACTIVE" != "active" ]; then
            echo "::error::com.besidka/mcp $VERSION has registry status \"$ACTIVE\", expected \"active\""
            exit 1
          fi

          echo "Published com.besidka/mcp $VERSION to the MCP Registry (active)." >> "$GITHUB_STEP_SUMMARY"

  deploy-preview:
    name: Deploy long-lived preview
    needs: deploy
    if: >-
      !cancelled()
      && needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: preview-build
          path: .output/

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Apply migrations to preview database
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          command: -v
          postCommands: yes | pnpm exec wrangler d1 migrations apply DB --remote

      - name: Apply consent migrations to preview database
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          command: -v
          postCommands: yes | pnpm exec wrangler d1 migrations apply CONSENT_DB --remote

      - name: Deploy long-lived preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          pnpm exec wrangler preview \
            --env production \
            --name preview \
            --message "main@${COMMIT_SHA}"

  cleanup-preview-build-artifact:
    name: Cleanup preview build artifact
    needs:
      - deploy
      - deploy-preview
    if: >-
      !cancelled()
      && needs.deploy.result == 'success'
      && needs.deploy-preview.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete preview-build artifact
        run: |
          ARTIFACT_IDS=$(gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "preview-build") | .id')

          if [ -z "$ARTIFACT_IDS" ]; then
            echo "No preview-build artifacts found for run ${{ github.run_id }}"
            exit 0
          fi

          for artifactId in $ARTIFACT_IDS; do
            gh api "repos/${{ github.repository }}/actions/artifacts/${artifactId}" \
              -X DELETE
            echo "Deleted preview-build artifact ${artifactId}"
          done
        env:
          GH_TOKEN: ${{ github.token }}
