name: Preview Deploy
run-name: "Preview Deploy · PR #${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }} · ${{ github.event.workflow_run.head_branch || 'unknown-branch' }}"

on:
  workflow_run:
    workflows: ["Preview Build"]
    types: [completed]

concurrency:
  group: preview-deploy-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Preview
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      statuses: write

    steps:
      - name: Get PR metadata from event context
        id: pr
        run: |
          PR_NUMBER=$(echo '${{ toJSON(github.event.workflow_run.pull_requests) }}' | jq -r '.[0].number // empty')
          PR_SHA="${{ github.event.workflow_run.head_sha }}"
          PR_SHA_SHORT=$(echo "$PR_SHA" | cut -c1-7)

          if [ -z "$PR_NUMBER" ]; then
            echo "No PR found for this workflow run"
            exit 1
          fi

          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "sha=$PR_SHA" >> $GITHUB_OUTPUT
          echo "sha-short=$PR_SHA_SHORT" >> $GITHUB_OUTPUT

      - name: Check if PR is from fork
        id: fork-check
        run: |
          HEAD_REPO="${{ github.event.workflow_run.head_repository.full_name }}"
          BASE_REPO="${{ github.event.workflow_run.repository.full_name }}"
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "is-fork=true" >> $GITHUB_OUTPUT
            echo "Fork PR detected ($HEAD_REPO != $BASE_REPO)"
          else
            echo "is-fork=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip deploy for fork PRs
        if: steps.fork-check.outputs.is-fork == 'true'
        uses: mshick/add-pr-comment@v3
        with:
          issue: ${{ steps.pr.outputs.number }}
          allow-repeats: false
          message: |
            Preview deployment skipped for fork PRs (security policy).
            A maintainer can comment `/deploy-preview` to trigger deployment.

      - name: Set deploy status for fork PRs
        if: steps.fork-check.outputs.is-fork == 'true'
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.sha }}" \
            -f state=success \
            -f context="Preview Deploy" \
            -f description="Skipped (fork PR - use /deploy-preview)"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Checkout PR head
        if: steps.fork-check.outputs.is-fork == 'false'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.sha }}

      - name: Download build artifact
        if: steps.fork-check.outputs.is-fork == 'false'
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: preview-build
          path: .output/
          github-token: ${{ github.token }}

      - name: Download drizzle artifact
        if: steps.fork-check.outputs.is-fork == 'false'
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: preview-drizzle
          path: .
          github-token: ${{ github.token }}

      - name: Setup PNPM
        if: steps.fork-check.outputs.is-fork == 'false'
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        if: steps.fork-check.outputs.is-fork == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.fork-check.outputs.is-fork == 'false'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Record deploy start time
        if: steps.fork-check.outputs.is-fork == 'false'
        id: deploy-start
        run: echo "start-time=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Apply migrations to preview database
        if: steps.fork-check.outputs.is-fork == 'false'
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          command: -v
          postCommands: yes | pnpm exec wrangler d1 migrations apply DB --remote

      - name: Apply consent migrations to preview database
        if: steps.fork-check.outputs.is-fork == 'false'
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          command: -v
          postCommands: yes | pnpm exec wrangler d1 migrations apply CONSENT_DB --remote

      - name: Deploy PR preview to Cloudflare
        if: steps.fork-check.outputs.is-fork == 'false'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_URL: https://github.com/${{ github.repository }}/pull/${{ steps.pr.outputs.number }}
        run: |
          pnpm exec wrangler preview \
            --env production \
            --name "pr-${PR_NUMBER}" \
            --message "$PR_URL" \
            --json > "$RUNNER_TEMP/preview.json"

      - name: Calculate deploy time
        if: steps.fork-check.outputs.is-fork == 'false'
        id: deploy-time
        run: |
          START=${{ steps.deploy-start.outputs.start-time }}
          END=$(date +%s)
          DURATION=$((END - START))
          echo "duration=${DURATION}s" >> $GITHUB_OUTPUT
          echo "Deploy completed in ${DURATION}s"

      - name: Extract preview URLs
        if: steps.fork-check.outputs.is-fork == 'false'
        id: urls
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          FALLBACK_URL="https://pr-${PR_NUMBER}-besidka.chernenko.workers.dev"
          CLEAN_JSON="$RUNNER_TEMP/preview-clean.json"

          sed -n '/^{/,$p' "$RUNNER_TEMP/preview.json" > "$CLEAN_JSON"

          if ! jq -e '.preview.id' "$CLEAN_JSON" > /dev/null 2>&1; then
            echo "::error::wrangler preview output did not contain valid JSON with .preview.id"
            exit 1
          fi

          PREVIEW_URL=$(jq -r '.preview.urls[0] // empty' "$CLEAN_JSON")
          DEPLOYMENT_URL=$(jq -r '.deployment.urls[0] // empty' "$CLEAN_JSON")

          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "::warning::wrangler preview returned no workers.dev URL (previews_enabled may be off on the besidka Worker)"
          fi

          echo "preview-url=${PREVIEW_URL:-$FALLBACK_URL}" >> $GITHUB_OUTPUT
          echo "deployment-url=${DEPLOYMENT_URL:-n/a}" >> $GITHUB_OUTPUT

      - name: Comment preview URL on PR
        if: steps.fork-check.outputs.is-fork == 'false'
        uses: mshick/add-pr-comment@v3
        with:
          issue: ${{ steps.pr.outputs.number }}
          allow-repeats: true
          message: |
            ## Deployed to <img width="16" alt="Cloudflare Workers logo" src="https://workers.cloudflare.com/logo.svg"> Cloudflare Workers

            | Property | Value |
            |----------|-------|
            | **Author** | [@${{ github.event.workflow_run.actor.login }}](https://github.com/${{ github.event.workflow_run.actor.login }}) |
            | **Deploy** | ${{ steps.deploy-time.outputs.duration }} |
            | **Latest commit** | [`${{ steps.pr.outputs.sha-short }}`](https://github.com/${{ github.repository }}/pull/${{ steps.pr.outputs.number }}/commits/${{ steps.pr.outputs.sha }}) |
            | **Preview URL (deployment)** | ${{ steps.urls.outputs.deployment-url }} |
            | **Preview URL (PR)** | ${{ steps.urls.outputs.preview-url }} |

            ---
            _**Note**:
            Each deployment gets a unique preview URL.
            The PR preview URL ${{ steps.urls.outputs.preview-url }} always points at the latest deployment._

      - name: Set deploy status success
        if: steps.fork-check.outputs.is-fork == 'false' && success()
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.sha }}" \
            -f state=success \
            -f context="Preview Deploy" \
            -f description="Deployed to preview" \
            -f target_url="${{ steps.urls.outputs.preview-url }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set deploy status failure
        if: steps.fork-check.outputs.is-fork == 'false' && failure()
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.sha }}" \
            -f state=failure \
            -f context="Preview Deploy" \
            -f description="Preview deployment failed"
        env:
          GH_TOKEN: ${{ github.token }}
