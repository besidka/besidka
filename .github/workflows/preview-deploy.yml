name: Preview Deploy
run-name: "Preview Deploy · ${{ github.event.workflow_run.pull_requests[0].number && format('PR #{0}', github.event.workflow_run.pull_requests[0].number) || 'no open PR' }} · ${{ github.event.workflow_run.head_branch || 'unknown-branch' }}"

on:
  workflow_run:
    workflows: ["Preview Build"]
    types: [completed]

concurrency:
  group: preview-deploy-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write

    steps:
      - name: Get PR metadata from event context
        id: pr
        run: |
          PR_SHA_SHORT=$(echo "$HEAD_SHA" | cut -c1-7)

          ARTIFACTS_JSON=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100")
          BUILD_ARTIFACT_TOTAL=$(printf '%s' "$ARTIFACTS_JSON" | jq '[(.artifacts // [])[] | select(.name == "preview-build")] | length')
          BUILD_ARTIFACT_VALID=$(printf '%s' "$ARTIFACTS_JSON" | jq '[(.artifacts // [])[] | select(.name == "preview-build" and .expired == false)] | length')

          if [ "$BUILD_ARTIFACT_TOTAL" = "0" ]; then
            echo "::notice::Preview deploy skipped: build run $RUN_ID uploaded no preview-build artifact. The run built nothing, for example a non-top layer of a stacked PR."
            {
              echo "sha=$HEAD_SHA"
              echo "sha-short=$PR_SHA_SHORT"
              echo "skip=true"
              echo "skip-reason=no-build"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$BUILD_ARTIFACT_VALID" = "0" ]; then
            {
              echo "sha=$HEAD_SHA"
              echo "sha-short=$PR_SHA_SHORT"
              echo "skip=false"
            } >> "$GITHUB_OUTPUT"
            echo "::error::The preview-build artifact of build run $RUN_ID has expired (retention-days: 1), so this commit cannot be deployed. Re-run the Preview Build workflow for $PR_SHA_SHORT to produce a fresh artifact."
            exit 1
          fi

          PR_NUMBER=$(printf '%s' "$PULL_REQUESTS_JSON" | jq -r '.[0].number // empty')

          if [ -z "$PR_NUMBER" ]; then
            SHA_PULLS_JSON=$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/pulls")
            PR_NUMBER=$(printf '%s' "$SHA_PULLS_JSON" | jq -r --arg sha "$HEAD_SHA" --arg repo "$HEAD_REPOSITORY" '[.[] | select(.state == "open" and .head.sha == $sha and .head.repo.full_name == $repo)][0].number // empty')
          fi

          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "sha-short=$PR_SHA_SHORT" >> "$GITHUB_OUTPUT"

          if [ -z "$PR_NUMBER" ]; then
            echo "::notice::Preview deploy skipped: no open PR has $PR_SHA_SHORT as its head in $HEAD_REPOSITORY. The PR was likely closed or merged before its build finished."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUESTS_JSON: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}

      - name: Resolve deploy status for run without build
        if: steps.pr.outputs.skip-reason == 'no-build'
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.sha }}" \
            -f state=success \
            -f context="Preview Deploy" \
            -f description="Skipped (no build for this commit)"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Resolve pending deploy status for closed PR
        if: steps.pr.outputs.skip == 'true' && steps.pr.outputs.skip-reason != 'no-build'
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.sha }}" \
            -f state=success \
            -f context="Preview Deploy" \
            -f description="Skipped (no open PR for this commit)"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check PR is still open
        id: pr-state
        if: steps.pr.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          PR_STATE=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .state)

          if [ "$PR_STATE" = "open" ]; then
            echo "is-open=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "is-open=false" >> "$GITHUB_OUTPUT"
          echo "::notice::PR #${PR_NUMBER} is ${PR_STATE}; skipping preview deploy"

      - name: Check whether the PR changes wrangler.jsonc
        id: config-drift
        if: steps.pr-state.outputs.is-open == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          if ! CHANGED_FILES=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename'); then
            echo "::warning::Could not list the files changed by this PR, so the wrangler.jsonc check did not run."
            echo "changed=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if printf '%s\n' "$CHANGED_FILES" | grep -qx 'wrangler.jsonc'; then
            echo "::warning::This PR changes wrangler.jsonc, but previews deploy with the default branch's wrangler.jsonc. Bindings, vars and compatibility settings from this PR are not in the preview until it merges."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=false" >> "$GITHUB_OUTPUT"

      - name: Checkout default branch
        if: steps.pr-state.outputs.is-open == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Remove default-branch migrations
        if: steps.pr-state.outputs.is-open == 'true'
        run: rm -rf .drizzle

      - name: Download build artifact
        if: steps.pr-state.outputs.is-open == 'true'
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: preview-build
          path: .output/
          github-token: ${{ github.token }}

      - name: Download drizzle artifact
        if: steps.pr-state.outputs.is-open == 'true'
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: preview-drizzle
          path: .drizzle/
          github-token: ${{ github.token }}

      - name: Verify artifacts stayed inside .output and .drizzle
        if: steps.pr-state.outputs.is-open == 'true'
        run: |
          CHANGED=$(git status --porcelain --ignored --untracked-files=all -- . ':(exclude).output' ':(exclude).drizzle')

          if [ -n "$CHANGED" ]; then
            printf '%s\n' "$CHANGED"
            echo "::error::The preview artifacts wrote outside .output/ and .drizzle/."
            exit 1
          fi

      - name: Verify migrations match the PR commit
        if: steps.pr-state.outputs.is-open == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail
          export LC_ALL=C

          EXPECTED="$RUNNER_TEMP/drizzle-expected.txt"
          ACTUAL="$RUNNER_TEMP/drizzle-actual.txt"

          DRIZZLE_TREE_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents?ref=${PR_SHA}" --jq '.[] | select(.name == ".drizzle" and .type == "dir") | .sha')

          if [ -n "$DRIZZLE_TREE_SHA" ]; then
            TREE_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/git/trees/${DRIZZLE_TREE_SHA}?recursive=1")

            if [ "$(printf '%s' "$TREE_JSON" | jq '.truncated')" = "true" ]; then
              echo "::error::The .drizzle tree of $PR_SHA is too large to list, so its migrations cannot be verified."
              exit 1
            fi

            printf '%s' "$TREE_JSON" | jq -r '.tree[] | select(.type == "blob") | "\(.sha) .drizzle/\(.path)"' | sort > "$EXPECTED"
          else
            : > "$EXPECTED"
          fi

          if [ -d .drizzle ]; then
            find .drizzle ! -type d | while IFS= read -r file; do
              echo "$(git hash-object --no-filters "$file") $file"
            done | sort > "$ACTUAL"
          else
            : > "$ACTUAL"
          fi

          if ! diff "$EXPECTED" "$ACTUAL"; then
            echo "::error::The preview-drizzle artifact does not match the migrations committed in this PR (generated or extra migration files). Run pnpm run db:generate and pnpm run db:consents:generate locally, review the SQL for DROP TABLE, and commit the migrations."
            exit 1
          fi

      - name: Setup PNPM
        if: steps.pr-state.outputs.is-open == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false

      - name: Install Node.js
        if: steps.pr-state.outputs.is-open == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.pr-state.outputs.is-open == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Record deploy start time
        if: steps.pr-state.outputs.is-open == 'true'
        id: deploy-start
        run: echo "start-time=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Apply migrations to preview database
        if: steps.pr-state.outputs.is-open == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: yes | pnpm exec wrangler d1 migrations apply DB --remote

      - name: Apply consent migrations to preview database
        if: steps.pr-state.outputs.is-open == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: yes | pnpm exec wrangler d1 migrations apply CONSENT_DB --remote

      - name: Deploy PR preview to Cloudflare
        if: steps.pr-state.outputs.is-open == 'true'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_URL: https://github.com/${{ github.repository }}/pull/${{ steps.pr.outputs.number }}
        run: |
          pnpm exec wrangler preview \
            --env production \
            --name "pr-${PR_NUMBER}" \
            --message "$PR_URL" \
            --json > "$RUNNER_TEMP/preview.json"

      - name: Delete preview if PR closed during deploy
        id: post-deploy-state
        if: steps.pr-state.outputs.is-open == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          PR_STATE=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .state)

          if [ "$PR_STATE" = "open" ]; then
            echo "closed-during-deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "closed-during-deploy=true" >> "$GITHUB_OUTPUT"
          echo "::notice::PR #${PR_NUMBER} was ${PR_STATE} during deploy; deleting the preview"

          PREVIEW_NAME="pr-${PR_NUMBER}"

          if pnpm exec wrangler preview delete \
            --name "$PREVIEW_NAME" \
            --env production \
            --skip-confirmation > "$RUNNER_TEMP/delete.log" 2>&1; then
            cat "$RUNNER_TEMP/delete.log"
            echo "Deleted preview ${PREVIEW_NAME}"
            exit 0
          fi

          cat "$RUNNER_TEMP/delete.log"

          if grep -qiE "code: 10025|preview not found" "$RUNNER_TEMP/delete.log"; then
            echo "Preview ${PREVIEW_NAME} does not exist; nothing to delete"
            exit 0
          fi

          exit 1

      - name: Calculate deploy time
        if: steps.pr-state.outputs.is-open == 'true' && steps.post-deploy-state.outputs.closed-during-deploy != 'true'
        id: deploy-time
        env:
          START: ${{ steps.deploy-start.outputs.start-time }}
        run: |
          END=$(date +%s)
          DURATION=$((END - START))
          echo "duration=${DURATION}s" >> "$GITHUB_OUTPUT"
          echo "Deploy completed in ${DURATION}s"

      - name: Extract preview URLs
        if: steps.pr-state.outputs.is-open == 'true' && steps.post-deploy-state.outputs.closed-during-deploy != 'true'
        id: urls
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          FALLBACK_URL="https://pr-${PR_NUMBER}-besidka.chernenko.workers.dev"
          CLEAN_JSON="$RUNNER_TEMP/preview-clean.json"

          sed -n '/^{/,$p' "$RUNNER_TEMP/preview.json" > "$CLEAN_JSON"

          if ! jq -e '.preview.id' "$CLEAN_JSON" > /dev/null 2>&1; then
            echo "::error::wrangler preview output did not contain valid JSON with .preview.id"
            exit 1
          fi

          PREVIEW_URL=$(jq -r '.preview.urls[0] // empty' "$CLEAN_JSON")
          DEPLOYMENT_URL=$(jq -r '.deployment.urls[0] // empty' "$CLEAN_JSON")

          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "::warning::wrangler preview returned no workers.dev URL (previews_enabled may be off on the besidka Worker)"
          fi

          echo "preview-url=${PREVIEW_URL:-$FALLBACK_URL}" >> "$GITHUB_OUTPUT"
          echo "deployment-url=${DEPLOYMENT_URL:-n/a}" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: steps.pr-state.outputs.is-open == 'true' && steps.post-deploy-state.outputs.closed-during-deploy != 'true'
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59
        with:
          issue: ${{ steps.pr.outputs.number }}
          allow-repeats: true
          message: |
            ## Deployed to <img width="16" alt="Cloudflare Workers logo" src="https://workers.cloudflare.com/logo.svg"> Cloudflare Workers

            | Property | Value |
            |----------|-------|
            | **Author** | [@${{ github.event.workflow_run.actor.login }}](https://github.com/${{ github.event.workflow_run.actor.login }}) |
            | **Deploy** | ${{ steps.deploy-time.outputs.duration }} |
            | **Latest commit** | [`${{ steps.pr.outputs.sha-short }}`](https://github.com/${{ github.repository }}/pull/${{ steps.pr.outputs.number }}/commits/${{ steps.pr.outputs.sha }}) |
            | **Preview URL (deployment)** | ${{ steps.urls.outputs.deployment-url }} |
            | **Preview URL (PR)** | ${{ steps.urls.outputs.preview-url }} |
            | **Wrangler config** | ${{ steps.config-drift.outputs.changed == 'true' && 'default branch (this PR''s wrangler.jsonc changes are not deployed)' || steps.config-drift.outputs.changed == 'unknown' && 'not checked (default branch used; could not list PR files)' || 'default branch' }} |

            ---
            _**Note**:
            Each deployment gets a unique preview URL.
            The PR preview URL ${{ steps.urls.outputs.preview-url }} always points at the latest deployment._

      - name: Set deploy status success
        if: steps.pr-state.outputs.is-open == 'true' && steps.post-deploy-state.outputs.closed-during-deploy != 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SHA: ${{ steps.pr.outputs.sha }}
          PREVIEW_URL: ${{ steps.urls.outputs.preview-url }}
          STATUS_DESCRIPTION: ${{ steps.config-drift.outputs.changed == 'true' && 'Deployed (default-branch wrangler.jsonc)' || steps.config-drift.outputs.changed == 'unknown' && 'Deployed (wrangler.jsonc check skipped)' || 'Deployed to preview' }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${PR_SHA}" \
            -f state=success \
            -f context="Preview Deploy" \
            -f description="$STATUS_DESCRIPTION" \
            -f target_url="$PREVIEW_URL"

      - name: Set deploy status failure
        if: steps.pr.outputs.skip == 'false' && steps.pr-state.outputs.is-open != 'false' && failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${PR_SHA}" \
            -f state=failure \
            -f context="Preview Deploy" \
            -f description="Preview deployment failed"
